<svg viewBox="0 0 32 32" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <!-- Jelly, Gesture's mascot: docs/mascot/jelly.html is its design sheet.
       Every mood's parts are here; ui/mascot.css shows the ones a mood needs
       (class m-alt is hidden until then) and moves them. The ids and classes
       are the contract in docs/MASCOT.md. -->
  <defs>
    <radialGradient id="mj-body" gradientUnits="userSpaceOnUse" cx="12" cy="9.5" r="23" fx="11" fy="8.5">
      <stop offset="0" stop-color="#FFE7CF" /><stop offset=".26" stop-color="#FFC09E" /><stop offset=".55" stop-color="#FF9094" />
      <stop offset=".82" stop-color="#F2618D" /><stop offset="1" stop-color="#D94886" />
    </radialGradient>
    <radialGradient id="mj-shade" gradientUnits="userSpaceOnUse" cx="16" cy="32" r="15">
      <stop offset="0" stop-color="#A82A6C" stop-opacity=".42" /><stop offset="1" stop-color="#A82A6C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mj-rim" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="28.4">
      <stop offset="0" stop-color="#FFDCCF" stop-opacity="0" /><stop offset="1" stop-color="#FFDCCF" stop-opacity=".9" />
    </linearGradient>
    <linearGradient id="mj-top" gradientUnits="userSpaceOnUse" x1="26" y1="6" x2="20" y2="16">
      <stop offset="0" stop-color="#FFF4EC" stop-opacity=".7" /><stop offset="1" stop-color="#FFF4EC" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mj-shine" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95" /><stop offset=".55" stop-color="#fff" stop-opacity=".5" /><stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="mj-eye" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A2A5E" /><stop offset="1" stop-color="#1E0F2E" /></linearGradient>
    <linearGradient id="mj-hand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE8D6" /><stop offset="1" stop-color="#FFA4AF" /></linearGradient>
    <clipPath id="mj-clip"><path d="M16 4.6 C22.9 4.6 28.1 9.8 28.1 17.2 C28.1 23.9 23.2 28 16 28 C8.8 28 3.9 23.9 3.9 17.2 C3.9 9.8 9.1 4.6 16 4.6 Z" /></clipPath>
    <clipPath id="mj-grin"><path d="M14.2 20.6 C15.4 20.9 16.6 20.9 17.8 20.6 C17.7 22.5 16.9 23.5 16 23.5 C15.1 23.5 14.3 22.5 14.2 20.6 Z" /></clipPath>
    <filter id="mj-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.8" /></filter>
    <filter id="mj-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation=".4" /></filter>
    <filter id="mj-blush" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation=".7" /></filter>
    <filter id="mj-ground" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1" /></filter>
    <filter id="mj-lift" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy=".5" stdDeviation=".45" flood-color="#9B2A5E" flood-opacity=".45" />
    </filter>
  </defs>

  <!-- Hold progress, for the page header. -->
  <circle id="m-ring" cx="16" cy="16.3" r="14.8" pathLength="100" />

  <g id="m-shadow">
    <ellipse cx="16" cy="28.7" rx="9.4" ry="1.4" fill="#8A2A58" opacity=".18" filter="url(#mj-ground)" />
    <ellipse cx="16" cy="27.95" rx="7.2" ry=".8" fill="#8A2A58" opacity=".3" filter="url(#mj-soft)" />
  </g>

  <!-- Hands behind the body: the shrug and the wave. -->
  <g class="m-alt m-hand-shrug" filter="url(#mj-lift)">
    <g transform="rotate(-62 3.5 16.6)"><rect x="1.55" y="13.8" width="3.9" height="5.6" rx="1.95" fill="url(#mj-hand)" /><ellipse cx="2.88" cy="15.26" rx=".66" ry="1.01" fill="#fff" opacity=".6" /></g>
    <g transform="rotate(62 28.5 16.6)"><rect x="26.55" y="13.8" width="3.9" height="5.6" rx="1.95" fill="url(#mj-hand)" /><ellipse cx="27.88" cy="15.26" rx=".66" ry="1.01" fill="#fff" opacity=".6" /></g>
  </g>
  <g class="m-alt m-hand-wave">
    <g class="m-waving" filter="url(#mj-lift)">
      <g transform="rotate(22 28.7 9.5)">
        <rect x="26.75" y="6.7" width="3.9" height="5.6" rx="1.95" fill="url(#mj-hand)" />
        <ellipse cx="28.08" cy="8.16" rx=".66" ry="1.01" fill="#fff" opacity=".6" />
        <path d="M27.92 6.95 V8.2 M29.48 6.95 V8.2" stroke="#E8798F" stroke-width=".32" stroke-linecap="round" />
      </g>
    </g>
    <path d="M31.4 5.8 q1 1.2 .45 2.6 M32.5 4.7 q1.5 1.9 .6 3.9" stroke="#2B1638" stroke-opacity=".4" stroke-width=".55" fill="none" stroke-linecap="round" />
  </g>

  <g id="m-body">
    <path d="M16 4.6 C22.9 4.6 28.1 9.8 28.1 17.2 C28.1 23.9 23.2 28 16 28 C8.8 28 3.9 23.9 3.9 17.2 C3.9 9.8 9.1 4.6 16 4.6 Z" fill="url(#mj-body)" />
    <g clip-path="url(#mj-clip)">
      <path d="M16 4.6 C22.9 4.6 28.1 9.8 28.1 17.2 C28.1 23.9 23.2 28 16 28 C8.8 28 3.9 23.9 3.9 17.2 C3.9 9.8 9.1 4.6 16 4.6 Z" fill="url(#mj-shade)" />
      <!-- Light passing through the jelly, opposite the highlight. -->
      <ellipse cx="19.8" cy="22.6" rx="6.8" ry="4.2" fill="#FFC7A6" opacity=".42" filter="url(#mj-glow)" />
      <path d="M16 4.6 C22.9 4.6 28.1 9.8 28.1 17.2 C28.1 23.9 23.2 28 16 28 C8.8 28 3.9 23.9 3.9 17.2 C3.9 9.8 9.1 4.6 16 4.6 Z" fill="none" stroke="url(#mj-rim)" stroke-width="1.8" filter="url(#mj-soft)" />
      <path d="M16 4.6 C22.9 4.6 28.1 9.8 28.1 17.2 C28.1 23.9 23.2 28 16 28 C8.8 28 3.9 23.9 3.9 17.2 C3.9 9.8 9.1 4.6 16 4.6 Z" fill="none" stroke="url(#mj-top)" stroke-width="1.2" filter="url(#mj-soft)" />
    </g>
    <ellipse cx="10.9" cy="10" rx="4.7" ry="2.45" transform="rotate(-34 10.9 10)" fill="url(#mj-shine)" filter="url(#mj-soft)" />

    <!-- The face turns toward what it looks at: --gaze-x and --gaze-y. -->
    <g id="m-face">
      <ellipse cx="9.7" cy="20.3" rx="2.05" ry="1.2" fill="#FF5A8C" opacity=".34" filter="url(#mj-blush)" />
      <ellipse cx="22.3" cy="20.3" rx="2.05" ry="1.2" fill="#FF5A8C" opacity=".34" filter="url(#mj-blush)" />
      <g id="m-eyes">
        <g class="m-look">
          <g id="m-eye-l">
            <g class="m-open">
              <rect x="10.6" y="13.9" width="3" height="5.2" rx="1.5" fill="url(#mj-eye)" />
              <circle cx="12.7" cy="15.15" r=".78" fill="#fff" />
              <circle cx="11.59" cy="17.95" r=".36" fill="#fff" opacity=".6" />
            </g>
            <path class="m-alt m-happy" d="M10.35 17.3 Q12.1 14.8 13.85 17.3" />
            <path class="m-alt m-closed" d="M10.35 16.8 Q12.1 18.5 13.85 16.8" />
            <path class="m-alt m-brow m-worried" d="M10.4 12.8 L13.3 11.9" />
            <path class="m-alt m-brow m-raised" d="M10.6 12.5 Q12.1 11.4 13.6 12.5" />
          </g>
          <g id="m-eye-r">
            <g class="m-open">
              <rect x="18.4" y="13.9" width="3" height="5.2" rx="1.5" fill="url(#mj-eye)" />
              <circle cx="20.5" cy="15.15" r=".78" fill="#fff" />
              <circle cx="19.39" cy="17.95" r=".36" fill="#fff" opacity=".6" />
            </g>
            <path class="m-alt m-happy" d="M18.15 17.3 Q19.9 14.8 21.65 17.3" />
            <path class="m-alt m-closed" d="M18.15 16.8 Q19.9 18.5 21.65 16.8" />
            <path class="m-alt m-brow m-worried" d="M21.6 12.8 L18.7 11.9" />
            <path class="m-alt m-brow m-raised" d="M18.4 12.5 Q19.9 11.4 21.4 12.5" />
          </g>
        </g>
      </g>
      <g id="m-mouth">
        <path class="m-smile" d="M14.65 20.95 Q16 22.35 17.35 20.95" />
        <path class="m-alt m-small" d="M15.1 21.05 Q16 21.95 16.9 21.05" />
        <path class="m-alt m-flat" d="M14.95 21.4 H17.05" />
        <path class="m-alt m-wavy" d="M14.3 21.5 q.57 -.6 1.13 0 t1.13 0 t1.13 0" />
        <ellipse class="m-alt m-o" cx="16" cy="21.5" rx=".78" ry=".98" />
        <g class="m-alt m-grin">
          <path d="M14.2 20.6 C15.4 20.9 16.6 20.9 17.8 20.6 C17.7 22.5 16.9 23.5 16 23.5 C15.1 23.5 14.3 22.5 14.2 20.6 Z" />
          <ellipse cx="16" cy="23" rx="1.05" ry=".62" fill="#FF7393" clip-path="url(#mj-grin)" />
        </g>
      </g>
    </g>
  </g>

  <!-- Hands in front: covering its eyes while the camera is off, and the OK sign. -->
  <g class="m-alt m-hand-cover" filter="url(#mj-lift)">
    <g transform="rotate(48 11.7 17.2)">
      <rect x="9.4" y="13.9" width="4.6" height="6.6" rx="2.3" fill="url(#mj-hand)" />
      <ellipse cx="10.96" cy="15.62" rx=".78" ry="1.19" fill="#fff" opacity=".6" />
      <path d="M10.78 14.15 V15.4 M12.62 14.15 V15.4" stroke="#E8798F" stroke-width=".32" stroke-linecap="round" />
    </g>
    <g transform="rotate(-48 20.3 17.2)">
      <rect x="18" y="13.9" width="4.6" height="6.6" rx="2.3" fill="url(#mj-hand)" />
      <ellipse cx="19.56" cy="15.62" rx=".78" ry="1.19" fill="#fff" opacity=".6" />
      <path d="M19.38 14.15 V15.4 M21.22 14.15 V15.4" stroke="#E8798F" stroke-width=".32" stroke-linecap="round" />
    </g>
  </g>
  <g class="m-alt m-hand-ok" filter="url(#mj-lift)">
    <rect x="26.7" y="7.3" width="1.4" height="4.2" rx=".7" fill="url(#mj-hand)" transform="rotate(-8 27.4 9.4)" />
    <rect x="28.33" y="7.95" width="1.35" height="3.9" rx=".68" fill="url(#mj-hand)" transform="rotate(12 29 9.9)" />
    <rect x="29.73" y="9.45" width="1.25" height="3.3" rx=".63" fill="url(#mj-hand)" transform="rotate(32 30.35 11.1)" />
    <rect x="25.9" y="11.6" width="4.8" height="4.6" rx="2.3" fill="url(#mj-hand)" transform="rotate(10 28.3 13.9)" />
    <circle cx="25.4" cy="12.5" r="1.6" fill="none" stroke="url(#mj-hand)" stroke-width="1.3" />
    <ellipse cx="27.4" cy="12.9" rx=".7" ry=".9" fill="#fff" opacity=".55" />
  </g>

  <!-- Little signs: sleeping, sweating, thinking. -->
  <g class="m-alt m-z" fill="none" stroke="#8C6CC4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24.4 5.2 h2.2 l-2.2 2.5 h2.2" stroke-width=".8" />
    <path d="M27.6 2.2 h1.5 l-1.5 1.7 h1.5" stroke-width=".65" />
  </g>
  <g class="m-alt m-sweat">
    <path d="M25.7 7.2 C26.7 8.7 27.2 9.5 27.2 10.3 a1.5 1.5 0 0 1 -3 0 C24.2 9.5 24.7 8.7 25.7 7.2 Z" fill="#9FDBFF" />
    <ellipse cx="25.2" cy="10.1" rx=".35" ry=".6" fill="#fff" opacity=".85" />
  </g>
  <g class="m-alt m-spark">
    <path d="M26.2 3.8 Q26.5 5.9 28.6 6.2 Q26.5 6.5 26.2 8.6 Q25.9 6.5 23.8 6.2 Q25.9 5.9 26.2 3.8 Z" fill="#FFD27A" />
    <path d="M29.4 8.6 Q29.55 9.65 30.6 9.8 Q29.55 9.95 29.4 11 Q29.25 9.95 28.2 9.8 Q29.25 9.65 29.4 8.6 Z" fill="#FFE3A3" />
  </g>
</svg>
