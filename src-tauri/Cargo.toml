[package]
name = "gesture"
version = "1.0.0"
description = "Webcam hand gestures that run keyboard shortcuts"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gesture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-shell = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
